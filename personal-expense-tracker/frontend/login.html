<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Ledgerly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="auth-page" data-auth-page="login">
  <main class="auth-layout">
    <a class="brand" href="index.html"><span class="brand-mark">L</span> Ledgerly</a>
    <section class="auth-panel" aria-labelledby="login-title">
      <p class="eyebrow">Welcome back</p>
      <h1 id="login-title">Good to see you.</h1>
      <p class="auth-subtitle">Sign in to pick up where you left off.</p>
      <div class="alert alert-danger d-none" data-message role="alert"></div>
      <form data-auth-form="login" novalidate>
        <label class="form-label" for="email">Email address</label>
        <input class="form-control form-control-lg mb-3" id="email" name="email" type="email" autocomplete="email" required>
        <label class="form-label" for="password">Password</label>
        <div class="auth-password-field mb-4">
          <input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="current-password" required>
          <button class="auth-password-toggle" type="button" aria-label="Show password" aria-pressed="false" data-password-toggle>Show</button>
        </div>
        <button class="btn btn-primary btn-lg w-100" type="submit">Sign in <span aria-hidden="true">&#8594;</span></button>
      </form>
      <button class="btn btn-outline-dark w-100 mt-3" type="button" data-oauth-provider="google">Continue with Google</button>
      <p class="auth-switch">New to Ledgerly? <a href="signup.html">Create an account</a></p>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
